version: '3'
services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: breaking-beans-test
    environment:
      - TZ=Europe/Berlin
    volumes:
      - ./ha_test_config:/config
      - ./custom_components:/config/custom_components
    ports:
      - "8123:8123"
    restart: unless-stopped
