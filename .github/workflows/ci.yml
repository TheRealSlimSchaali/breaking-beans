name: Python test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install homeassistant voluptuous
    - name: Run Python Syntax Check for Corruptions
      run: |
        python -c "import ast; import glob; [ast.parse(open(f).read()) for f in glob.glob('custom_components/breaking_beans/*.py')]"
        echo "Syntax OK"
