name: Deploy Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'wiki/**'
      - '.github/workflows/deploy-wiki.yml'

jobs:
  deploy-wiki:
    runs-on: ubuntu-latest
    
    # We need write permissions to push to the wiki repository
    permissions:
      contents: write

    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v4

      - name: Checkout Wiki Repository
        uses: actions/checkout@v4
        with:
          # The wiki repository is always named <repo>.wiki
          repository: ${{ github.repository }}.wiki
          # Check it out into a temporary subfolder
          path: .wiki-repo
          # GITHUB_TOKEN automatically has permissions to push to the wiki
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync files and Push
        run: |
          # Use rsync to copy the contents of the local wiki folder to the actual wiki repo
          # --delete ensures that files deleted in main repo are also deleted in the wiki
          rsync -av --delete --exclude='.git' ./wiki/ ./.wiki-repo/
          
          cd ./.wiki-repo
          
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Add all changes
          git add .
          
          # Commit and push only if there are changes
          if git diff --staged --quiet; then
            echo "No changes to the wiki detected. Skipping push."
          else
            echo "Changes detected. Committing and pushing to Wiki..."
            git commit -m "docs: sync wiki from main repository ($GITHUB_SHA)"
            git push origin HEAD
          fi
